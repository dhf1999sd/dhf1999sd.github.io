<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Wenxue Wu</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060b14" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <style>
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
    }

    @font-face {
      font-family: "Newsreader";
      font-style: normal;
      font-weight: 200 800;
      font-display: swap;
      src: url("fonts/newsreader-latin-wght-normal.woff2") format("woff2-variations");
    }

    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --link: #2563eb;
      --chip-bg: #f5f5f7;
      --chip-hover: #e8e8ed;
      --card-border: rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #060b14;
        --text: #e6edf7;
        --muted: #9ca9c2;
        --link: #8dbdf0;
        --chip-bg: #131c2c;
        --chip-hover: #1c283c;
        --card-border: rgba(255, 255, 255, 0.08);
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .box {
      text-align: center;
      padding: 32px 24px;
    }

    .code {
      font-family: "Newsreader", Georgia, "Times New Roman", serif;
      font-size: 110px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #2563eb 20%, #7c6cf0 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 {
      font-family: "Newsreader", Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-weight: 600;
      margin: 18px 0 8px;
    }

    p {
      color: var(--muted);
      margin: 0 0 28px;
      font-size: 15px;
    }

    a {
      display: inline-block;
      color: var(--link);
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      padding: 9px 20px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--chip-bg);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    a:hover {
      background: var(--chip-hover);
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <main class="box">
    <div class="code" aria-hidden="true">404</div>
    <h1>Page not found</h1>
    <p>This page doesn't exist — it may have moved or never been here.</p>
    <a href="/">← Back to Homepage</a>
  </main>
</body>

</html>
